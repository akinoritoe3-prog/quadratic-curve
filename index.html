<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2次曲線シミュレーター</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            background-color: #f3f4f6;
        }
        canvas {
            background-color: #ffffff;
            cursor: crosshair;
        }
        .slider-label {
            display: inline-block;
            width: 2rem;
            font-weight: bold;
        }
        .info-label {
            font-weight: 600;
            color: #4b5563;
        }
        .info-value {
            font-family: monospace;
            font-size: 1.1rem;
            color: #111827;
        }
        /* Custom scrollbar for better appearance */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
</head>
<body class="h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-blue-600 text-white p-4 shadow-md z-10 relative">
        <h1 class="text-2xl font-bold text-center">2次曲線 グラフシミュレーター</h1>
        <p class="text-center text-blue-100 text-sm mt-1">放物線・楕円・双曲線の性質を視覚的に学ぼう</p>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col md:flex-row overflow-hidden">
        
        <!-- Left: Canvas Area -->
        <div class="flex-1 p-4 flex items-center justify-center bg-gray-200 overflow-hidden relative">
            <div class="relative bg-white shadow-lg rounded-lg overflow-hidden border border-gray-300 flex items-center justify-center" style="width: 100%; max-width: 600px; aspect-ratio: 1/1;">
                <canvas id="graph-canvas" class="absolute top-0 left-0 w-full h-full"></canvas>
            </div>
            <!-- Zoom Hint -->
            <div class="absolute bottom-6 left-6 bg-white/80 px-3 py-1 rounded text-sm text-gray-600 shadow">
                1目盛り = 1
            </div>
        </div>

        <!-- Right: Controls & Info -->
        <div class="w-full md:w-96 bg-white border-l border-gray-200 flex flex-col shadow-lg overflow-y-auto">
            
            <!-- Curve Selection -->
            <div class="p-6 border-b border-gray-200">
                <h2 class="text-lg font-bold mb-4 text-gray-800">1. 曲線の種類を選択</h2>
                <div class="space-y-3">
                    <label class="flex items-center p-3 border rounded-lg cursor-pointer hover:bg-blue-50 transition-colors" id="label-parabola">
                        <input type="radio" name="curve-type" value="parabola" class="w-5 h-5 text-blue-600 focus:ring-blue-500" checked>
                        <span class="ml-3 font-medium text-gray-900">放物線</span>
                        <span class="ml-auto text-sm text-gray-500 font-mono">y² = 4px</span>
                    </label>
                    <label class="flex items-center p-3 border rounded-lg cursor-pointer hover:bg-green-50 transition-colors" id="label-ellipse">
                        <input type="radio" name="curve-type" value="ellipse" class="w-5 h-5 text-green-600 focus:ring-green-500">
                        <span class="ml-3 font-medium text-gray-900">楕円</span>
                        <span class="ml-auto text-sm text-gray-500 font-mono">x²/a² + y²/b² = 1</span>
                    </label>
                    <label class="flex items-center p-3 border rounded-lg cursor-pointer hover:bg-red-50 transition-colors" id="label-hyperbola">
                        <input type="radio" name="curve-type" value="hyperbola" class="w-5 h-5 text-red-600 focus:ring-red-500">
                        <span class="ml-3 font-medium text-gray-900">双曲線</span>
                        <span class="ml-auto text-sm text-gray-500 font-mono">x²/a² - y²/b² = 1</span>
                    </label>
                </div>
            </div>

            <!-- Parameter Controls -->
            <div class="p-6 border-b border-gray-200 bg-gray-50">
                <h2 class="text-lg font-bold mb-4 text-gray-800">2. パラメータの調整</h2>
                
                <!-- Parabola Controls -->
                <div id="controls-parabola" class="space-y-4">
                    <div>
                        <div class="flex justify-between mb-1">
                            <span class="slider-label text-blue-600">p = </span>
                            <span id="val-p" class="font-mono font-bold text-gray-800">1.0</span>
                        </div>
                        <input type="range" id="slider-p" min="-5" max="5" step="0.1" value="1" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-blue-600">
                        <div class="text-xs text-gray-500 mt-1 flex justify-between"><span>-5</span><span>0は不可</span><span>5</span></div>
                    </div>
                </div>

                <!-- Ellipse/Hyperbola Controls -->
                <div id="controls-ab" class="space-y-6 hidden">
                    <div>
                        <div class="flex justify-between mb-1">
                            <span class="slider-label text-green-600" id="label-color-a">a = </span>
                            <span id="val-a" class="font-mono font-bold text-gray-800">3.0</span>
                        </div>
                        <input type="range" id="slider-a" min="0.5" max="10" step="0.1" value="3" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-gray-600" id="slider-a-input">
                        <div class="text-xs text-gray-500 mt-1 flex justify-between"><span>0.5</span><span>10</span></div>
                    </div>
                    <div>
                        <div class="flex justify-between mb-1">
                            <span class="slider-label text-green-600" id="label-color-b">b = </span>
                            <span id="val-b" class="font-mono font-bold text-gray-800">2.0</span>
                        </div>
                        <input type="range" id="slider-b" min="0.5" max="10" step="0.1" value="2" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-gray-600" id="slider-b-input">
                        <div class="text-xs text-gray-500 mt-1 flex justify-between"><span>0.5</span><span>10</span></div>
                    </div>
                </div>
            </div>

            <!-- Information Panel -->
            <div class="p-6 flex-1 bg-white">
                <h2 class="text-lg font-bold mb-4 text-gray-800 border-l-4 border-yellow-400 pl-2">主要な要素</h2>
                
                <!-- Equations Display -->
                <div class="mb-4 p-3 bg-gray-100 rounded-lg border border-gray-200 text-center">
                    <span class="text-sm text-gray-500 block mb-1">方程式</span>
                    <span id="info-equation" class="text-xl font-mono font-bold text-gray-800">y² = 4x</span>
                </div>

                <!-- Dynamic Info List -->
                <ul id="info-list" class="space-y-3">
                    <!-- Fills dynamically via JS -->
                </ul>
            </div>
        </div>
    </main>

    <script>
        // DOM Elements
        const canvas = document.getElementById('graph-canvas');
        const ctx = canvas.getContext('2d');
        const radios = document.getElementsByName('curve-type');
        
        const controlsParabola = document.getElementById('controls-parabola');
        const controlsAB = document.getElementById('controls-ab');
        
        const sliderP = document.getElementById('slider-p');
        const sliderA = document.getElementById('slider-a');
        const sliderB = document.getElementById('slider-b');
        
        const valP = document.getElementById('val-p');
        const valA = document.getElementById('val-a');
        const valB = document.getElementById('val-b');
        
        const labelA = document.getElementById('label-color-a');
        const labelB = document.getElementById('label-color-b');
        
        const infoEquation = document.getElementById('info-equation');
        const infoList = document.getElementById('info-list');

        // State
        let currentCurve = 'parabola'; // 'parabola', 'ellipse', 'hyperbola'
        let p = 1.0;
        let a = 3.0;
        let b = 2.0;

        // Canvas settings
        let width, height, centerX, centerY;
        const scale = 30; // pixels per unit length (e.g., scale=30 means 1 unit = 30px)

        // Initialize Canvas size
        function resizeCanvas() {
            // Get actual display size
            const rect = canvas.parentElement.getBoundingClientRect();
            // Set canvas resolution to match display size for crisp lines
            canvas.width = rect.width;
            canvas.height = rect.height;
            width = canvas.width;
            height = canvas.height;
            centerX = width / 2;
            centerY = height / 2;
            draw();
        }

        window.addEventListener('resize', resizeCanvas);

        // Event Listeners for UI
        radios.forEach(radio => {
            radio.addEventListener('change', (e) => {
                currentCurve = e.target.value;
                updateUIVisibility();
                updateInfo();
                draw();
            });
        });

        sliderP.addEventListener('input', (e) => {
            let val = parseFloat(e.target.value);
            // Prevent p=0 for parabola
            if (val === 0) {
                val = 0.1;
                sliderP.value = val;
            }
            p = val;
            valP.textContent = p.toFixed(1);
            updateInfo();
            draw();
        });

        sliderA.addEventListener('input', (e) => {
            a = parseFloat(e.target.value);
            valA.textContent = a.toFixed(1);
            updateInfo();
            draw();
        });

        sliderB.addEventListener('input', (e) => {
            b = parseFloat(e.target.value);
            valB.textContent = b.toFixed(1);
            updateInfo();
            draw();
        });

        // UI update based on selected curve
        function updateUIVisibility() {
            // Reset borders
            document.getElementById('label-parabola').classList.remove('border-blue-500', 'bg-blue-50');
            document.getElementById('label-ellipse').classList.remove('border-green-500', 'bg-green-50');
            document.getElementById('label-hyperbola').classList.remove('border-red-500', 'bg-red-50');

            if (currentCurve === 'parabola') {
                controlsParabola.classList.remove('hidden');
                controlsAB.classList.add('hidden');
                document.getElementById('label-parabola').classList.add('border-blue-500', 'bg-blue-50');
            } else {
                controlsParabola.classList.add('hidden');
                controlsAB.classList.remove('hidden');
                
                // Colorize sliders based on type
                if (currentCurve === 'ellipse') {
                    document.getElementById('label-ellipse').classList.add('border-green-500', 'bg-green-50');
                    sliderA.className = "w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-green-600";
                    sliderB.className = "w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-green-600";
                    labelA.className = "slider-label text-green-600";
                    labelB.className = "slider-label text-green-600";
                } else {
                    document.getElementById('label-hyperbola').classList.add('border-red-500', 'bg-red-50');
                    sliderA.className = "w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-red-600";
                    sliderB.className = "w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-red-600";
                    labelA.className = "slider-label text-red-600";
                    labelB.className = "slider-label text-red-600";
                }
            }
        }

        // Calculate math values and update info panel
        function formatNum(num) {
            // Round to 2 decimal places to avoid floating point issues visually
            let rounded = Math.round(num * 100) / 100;
            return rounded;
        }

        function createInfoItem(label, value) {
            return `
                <li class="flex flex-col border-b border-gray-100 pb-2">
                    <span class="info-label text-sm">${label}</span>
                    <span class="info-value mt-1">${value}</span>
                </li>
            `;
        }

        function updateInfo() {
            let html = '';
            
            if (currentCurve === 'parabola') {
                let eqP = p * 4;
                infoEquation.textContent = `y² = ${formatNum(eqP)}x`;
                
                html += createInfoItem('頂点', '(0, 0)');
                html += createInfoItem('焦点 F', `(${formatNum(p)}, 0)`);
                html += createInfoItem('準線', `x = ${formatNum(-p)}`);
                
            } else if (currentCurve === 'ellipse') {
                infoEquation.textContent = `x²/${formatNum(a*a)} + y²/${formatNum(b*b)} = 1`;
                
                html += createInfoItem('中心', '(0, 0)');
                
                let c;
                if (a >= b) {
                    c = Math.sqrt(a*a - b*b);
                    html += createInfoItem('焦点 F, F\'', `(±${formatNum(c)}, 0)`);
                    html += createInfoItem('長軸の長さ', `${formatNum(2*a)}`);
                    html += createInfoItem('短軸の長さ', `${formatNum(2*b)}`);
                } else {
                    c = Math.sqrt(b*b - a*a);
                    html += createInfoItem('焦点 F, F\'', `(0, ±${formatNum(c)})`);
                    html += createInfoItem('長軸の長さ', `${formatNum(2*b)}`);
                    html += createInfoItem('短軸の長さ', `${formatNum(2*a)}`);
                }
                
            } else if (currentCurve === 'hyperbola') {
                infoEquation.textContent = `x²/${formatNum(a*a)} - y²/${formatNum(b*b)} = 1`;
                
                html += createInfoItem('中心', '(0, 0)');
                
                let c = Math.sqrt(a*a + b*b);
                html += createInfoItem('焦点 F, F\'', `(±${formatNum(c)}, 0)`);
                html += createInfoItem('漸近線', `y = ±${formatNum(b/a)}x`);
            }
            
            infoList.innerHTML = html;
        }

        // Convert math coordinates to canvas pixels
        function toPx(x, y) {
            return {
                px: centerX + x * scale,
                py: centerY - y * scale // y is inverted in canvas
            };
        }

        function drawGrid() {
            ctx.clearRect(0, 0, width, height);
            
            // Draw grid lines
            ctx.strokeStyle = '#e5e7eb'; // gray-200
            ctx.lineWidth = 1;
            
            const maxUnitsX = Math.ceil((width / 2) / scale);
            const maxUnitsY = Math.ceil((height / 2) / scale);

            ctx.beginPath();
            // Vertical lines
            for (let i = -maxUnitsX; i <= maxUnitsX; i++) {
                let x = centerX + i * scale;
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
            }
            // Horizontal lines
            for (let i = -maxUnitsY; i <= maxUnitsY; i++) {
                let y = centerY + i * scale;
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
            }
            ctx.stroke();

            // Draw Axes
            ctx.strokeStyle = '#9ca3af'; // gray-400
            ctx.lineWidth = 2;
            ctx.beginPath();
            // X axis
            ctx.moveTo(0, centerY);
            ctx.lineTo(width, centerY);
            // Y axis
            ctx.moveTo(centerX, 0);
            ctx.lineTo(centerX, height);
            ctx.stroke();

            // Axis Labels
            ctx.fillStyle = '#4b5563'; // gray-600
            ctx.font = '14px "Inter", sans-serif';
            ctx.fillText('x', width - 15, centerY - 10);
            ctx.fillText('y', centerX + 10, 15);
            ctx.fillText('O', centerX - 15, centerY + 15);
        }

        // Helper to draw a point
        function drawPoint(x, y, color = '#1f2937', label = '') {
            const pos = toPx(x, y);
            ctx.beginPath();
            ctx.arc(pos.px, pos.py, 4, 0, 2 * Math.PI);
            ctx.fillStyle = color;
            ctx.fill();
            if (label) {
                ctx.font = 'bold 12px "Inter", sans-serif';
                ctx.fillText(label, pos.px + 8, pos.py - 8);
            }
        }

        // Helper to draw a line
        function drawLineDash(m, c, color = '#6b7280', isVertical = false, vx = 0) {
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            
            if (isVertical) {
                let x = centerX + vx * scale;
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
            } else {
                // y = mx + c
                // finding points at edges of canvas
                let startX = -width/(2*scale);
                let endX = width/(2*scale);
                
                let startY = m * startX + c;
                let endY = m * endX + c;
                
                let p1 = toPx(startX, startY);
                let p2 = toPx(endX, endY);
                
                ctx.moveTo(p1.px, p1.py);
                ctx.lineTo(p2.px, p2.py);
            }
            ctx.stroke();
            ctx.setLineDash([]); // Reset
        }

        function drawParabola() {
            // y^2 = 4px => x = y^2 / 4p
            ctx.strokeStyle = '#2563eb'; // blue-600
            ctx.lineWidth = 3;
            ctx.beginPath();
            
            const maxUnitsY = (height / 2) / scale;
            let started = false;

            // Iterate over y to draw x
            for (let y = -maxUnitsY; y <= maxUnitsY; y += 0.05) {
                let x = (y * y) / (4 * p);
                const pos = toPx(x, y);
                
                if (!started) {
                    ctx.moveTo(pos.px, pos.py);
                    started = true;
                } else {
                    ctx.lineTo(pos.px, pos.py);
                }
            }
            ctx.stroke();

            // Draw Focus
            drawPoint(p, 0, '#ef4444', 'F');
            // Draw Directrix
            drawLineDash(0, 0, '#ef4444', true, -p);
        }

        function drawEllipse() {
            // x = a*cos(t), y = b*sin(t)
            ctx.strokeStyle = '#16a34a'; // green-600
            ctx.lineWidth = 3;
            ctx.beginPath();
            
            for (let t = 0; t <= 2 * Math.PI + 0.1; t += 0.05) {
                let x = a * Math.cos(t);
                let y = b * Math.sin(t);
                const pos = toPx(x, y);
                
                if (t === 0) ctx.moveTo(pos.px, pos.py);
                else ctx.lineTo(pos.px, pos.py);
            }
            ctx.stroke();

            // Draw Foci
            let c;
            if (a >= b) {
                c = Math.sqrt(a*a - b*b);
                drawPoint(c, 0, '#ef4444', 'F');
                drawPoint(-c, 0, '#ef4444', "F'");
            } else {
                c = Math.sqrt(b*b - a*a);
                drawPoint(0, c, '#ef4444', 'F');
                drawPoint(0, -c, '#ef4444', "F'");
            }
        }

        function drawHyperbola() {
            ctx.strokeStyle = '#dc2626'; // red-600
            ctx.lineWidth = 3;
            
            // Right branch: x = a*cosh(t), y = b*sinh(t)
            ctx.beginPath();
            let started = false;
            for (let t = -3; t <= 3; t += 0.05) {
                let x = a * Math.cosh(t);
                let y = b * Math.sinh(t);
                const pos = toPx(x, y);
                if (!started) { ctx.moveTo(pos.px, pos.py); started = true; }
                else { ctx.lineTo(pos.px, pos.py); }
            }
            ctx.stroke();

            // Left branch: x = -a*cosh(t), y = b*sinh(t)
            ctx.beginPath();
            started = false;
            for (let t = -3; t <= 3; t += 0.05) {
                let x = -a * Math.cosh(t);
                let y = b * Math.sinh(t);
                const pos = toPx(x, y);
                if (!started) { ctx.moveTo(pos.px, pos.py); started = true; }
                else { ctx.lineTo(pos.px, pos.py); }
            }
            ctx.stroke();

            // Draw Foci
            let c = Math.sqrt(a*a + b*b);
            drawPoint(c, 0, '#1f2937', 'F');
            drawPoint(-c, 0, '#1f2937', "F'");

            // Draw Asymptotes
            let m = b / a;
            drawLineDash(m, 0, '#9ca3af');
            drawLineDash(-m, 0, '#9ca3af');
        }

        // Main draw loop
        function draw() {
            drawGrid();
            
            if (currentCurve === 'parabola') {
                drawParabola();
            } else if (currentCurve === 'ellipse') {
                drawEllipse();
            } else if (currentCurve === 'hyperbola') {
                drawHyperbola();
            }
        }

        // Initialize
        window.onload = () => {
            resizeCanvas();
            updateUIVisibility();
            updateInfo();
        };

    </script>
</body>
</html>
